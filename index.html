<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>چالش ۱۰۷ روزه</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style></style>
  </head>
  <body>
    <h1>چالش ۱۰۷ روزه</h1>
    <div class="counter">روز باقی‌مانده: <span id="remaining">107</span></div>
    <div class="stats">
      <span>✅ فعال: <span id="green-count">0</span></span> |
      <span>❌ تعطیل: <span id="red-count">0</span></span> |
      <span>⬜ آینده: <span id="future-count">0</span></span>
    </div>
    <div style="position: absolute; top: 10px; left: 10px; max-width: 200px;">
      <canvas id="progressChart"></canvas>
    </div>
    

    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="controls">
      <button id="undo">↩ بازگردانی آخرین تغییر</button>
    </div>
    <div class="days" id="days"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
  </body>
</html>
